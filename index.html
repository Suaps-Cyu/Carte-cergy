  <style>
    :root{
      --ink:#0f2b2e;--ink-soft:#4d6266;--line:#dfe6e4;--paper:#fff;--wash:#f3f6f4;
      --sport:#007a63;--sport-wash:#e2f2ed;--campus:#1d5fa7;--campus-wash:#e4edf7;--signal:#ffc42e;
      --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:Barlow,Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font:400 15px/1.4 var(--body);color:var(--ink);background:var(--wash)}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer}
    :focus-visible{outline:3px solid var(--signal);outline-offset:2px}
    [hidden]{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    .icon{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    .app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(360px,420px) 1fr}
    .panel{display:flex;flex-direction:column;min-height:0;background:var(--paper);box-shadow:2px 0 18px #0f2b2e26;z-index:800}
    #map{min-height:0;background:#e6ebe8}

    .masthead{padding:20px 22px 18px;background:var(--ink);color:#fff}
    .masthead p{margin:0 0 6px;font-size:13px;font-weight:500;color:#b9d2cc}
    h1{margin:0;font:700 38px/1 var(--display);letter-spacing:.2px}
    .season{display:inline-block;margin-left:4px;padding:1px 7px 2px;border-radius:4px;background:var(--signal);color:var(--ink);font-size:.56em;vertical-align:.2em;white-space:nowrap}

    .view{flex:1;display:flex;flex-direction:column;min-height:0}
    .tools{padding:14px 22px 12px;border-bottom:1px solid var(--line)}
    .search{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border:1.5px solid #b8c6c2;border-radius:8px;background:var(--paper);color:var(--ink-soft)}
    .search:focus-within{border-color:var(--sport);outline:2px solid var(--sport)}
    .search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
    .search input::placeholder{color:var(--ink-soft)}
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .chip{flex:none;min-height:32px;padding:0 10px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-soft)}
    .chip:hover{border-color:var(--sport);color:var(--ink)}
    .chip[aria-pressed=true]{border-color:var(--sport);background:var(--sport);color:#fff}

    .scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
    .group{margin:0;padding:14px 22px 6px;font:700 15px/1 var(--display);letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
    .places{list-style:none;margin:0;padding:0}
    .place{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:0 12px;align-items:center;padding:10px 22px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
    .place:hover{background:var(--wash)}
    .num{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--sport-wash);color:var(--sport);font:700 23px/1 var(--display)}
    .campus .num{background:var(--campus-wash);color:var(--campus);font-size:19px}
    .place-text{min-width:0}
    .place-title{display:block;font:700 20px/1.1 var(--display)}
    .place-sub{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--ink-soft)}
    .modes{display:flex;gap:5px;color:var(--ink-soft)}
    .bonus{padding:2px 7px;border-radius:4px;background:var(--campus);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
    .others{display:grid;gap:0}
    .others .place{padding:9px 0;grid-template-columns:1fr auto}
    .empty{margin:0;padding:28px 22px;color:var(--ink-soft)}
    .empty button{padding:0;border:0;background:none;color:var(--sport);font-weight:600;text-decoration:underline}

    .back{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;padding:0 22px;border:0;border-bottom:1px solid var(--line);background:none;font-weight:600;color:var(--sport);text-align:left}
    .back:hover{background:var(--wash)}
    .detail-body{padding:20px 22px 26px}
    .detail-head{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
    .detail-head .num{width:52px;height:52px;background:var(--sport);color:#fff;font-size:30px}
    .detail-head.campus .num{background:var(--campus);color:#fff;font-size:24px}
    .kicker{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink-soft)}
    h2{margin:0;font:700 30px/1.05 var(--display)}
    h2:focus{outline:0}
    .facts{margin:20px 0 0;padding:0}
    .facts div{padding:11px 0;border-top:1px solid var(--line)}
    .facts dt{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft)}
    .facts dd{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 0}
    h3{margin:18px 0 8px;font:700 15px/1 var(--display);letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
    .routes{display:grid;gap:8px}
    .route{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;min-height:52px;padding:10px 12px;border:1.5px solid var(--sport);border-radius:8px;background:var(--paper);color:var(--ink);font-weight:600;line-height:1.25;text-decoration:none}
    .route:hover{background:var(--sport-wash)}
    .route .modes{color:var(--sport)}
    .route .out{color:var(--sport)}
    .route.plain{border-color:var(--line)}
    .route.plain:hover{border-color:var(--sport)}

    .legend{position:absolute;left:12px;bottom:22px;z-index:700;display:flex;gap:14px;padding:7px 11px;border-radius:7px;background:#fffffff0;box-shadow:0 1px 6px #0f2b2e33;font-size:13px;font-weight:500}
    .legend span{display:flex;align-items:center;gap:6px}
    .legend i{width:11px;height:11px;border-radius:50%;background:var(--sport)}
    .legend .c{background:var(--campus)}

    .leaflet-tile-pane{filter:saturate(.45) contrast(.96) brightness(1.03)}
    .leaflet-container{font-family:var(--body)}
    .leaflet-bar a{width:38px!important;height:38px!important;line-height:38px!important;color:var(--ink)}
    .pin{display:grid;place-items:center;width:34px;height:34px;border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--sport);box-shadow:0 2px 6px #0f2b2e66;transition:transform .15s}
    .pin span{transform:rotate(45deg);font:700 17px/1 var(--display);color:#fff}
    .pin.campus{background:var(--campus)}
    .pin.campus span{font-size:14px}
    .pin.on{transform:rotate(-45deg) scale(1.28);background:var(--ink);border-color:var(--signal);box-shadow:0 3px 10px #0f2b2e88}
    .pin-tip{padding:3px 8px;border:0;border-radius:5px;background:var(--ink);box-shadow:none;color:#fff;font-weight:600}
    .pin-tip::before{display:none}

    @media(max-width:760px){
      .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,38fr) minmax(0,62fr)}
      .panel{display:contents}
      .masthead{order:1;padding:10px 16px 11px}
      .masthead p{margin-bottom:2px;font-size:12px}
      h1{font-size:26px}
      #map{order:2}
      .view{order:3;background:var(--paper);box-shadow:0 -3px 14px #0f2b2e26;z-index:800}
      .tools{padding:10px 16px}
      .search{height:40px}
      .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:6px -16px 0;padding:0 16px}
      .group{padding:12px 16px 6px}
      .place{padding:9px 16px}
      .back{padding:0 16px}
      .detail-body{padding:16px 16px 22px}
      h2{font-size:27px}
      .legend{top:8px;left:8px;bottom:auto;gap:10px;padding:5px 8px;font-size:12px}
    }
    @media(prefers-reduced-motion:reduce){.pin{transition:none}}
  </style>
</head>

function mapsLink(p){return p.googleUrl||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.name+', '+p.address)}
function transitLink(p){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent('CY Cergy Paris Université Site des Chênes, 33 boulevard du Port, Cergy')+'&destination='+encodeURIComponent(p.transitDestination||p.name+', '+p.address)+(p.placeId?'&destination_place_id='+encodeURIComponent(p.placeId):'')+'&travelmode=transit'}
function drivingLink(p){const placeId=p.parkingPlaceId||p.placeId;return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p.drivingOrigin||'49.039683,2.075183')+'&destination='+encodeURIComponent(p.drivingDestination||p.parkingCoords||p.parking||p.lat+','+p.lng)+(placeId?'&destination_place_id='+encodeURIComponent(placeId):'')+(p.drivingWaypoints?'&waypoints='+encodeURIComponent(p.drivingWaypoints):'')+'&travelmode=driving'}
function walkingLink(p){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p.walkingOrigin||'49.039683,2.075183')+'&destination='+encodeURIComponent(p.walkingDestination||p.lat+','+p.lng)+(p.placeId?'&destination_place_id='+encodeURIComponent(p.placeId):'')+'&travelmode=walking'}
function mixedFootCarLink(p){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p.walkingOrigin||'49.039683,2.075183')+'&destination='+encodeURIComponent(p.walkingDestination||p.lat+','+p.lng)+(p.placeId?'&destination_place_id='+encodeURIComponent(p.placeId):'')+(p.routeWaypoints?'&waypoints='+encodeURIComponent(p.routeWaypoints):'')}
function walkingFromParkingLink(p){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p.parkingCoords||p.parking)+(p.parkingPlaceId?'&origin_place_id='+encodeURIComponent(p.parkingPlaceId):'')+'&destination='+encodeURIComponent(p.lat+','+p.lng)+'&travelmode=walking'}

// Itinéraires d'un lieu : [modes, libellé, lien]
function routesFor(p){
 const from=p.walkingOriginLabel||'CY – site des Chênes';
 const carLabel=p.parking?'Itinéraire en voiture de CY jusqu’au '+p.parking.split(',')[0]:'Itinéraire en voiture depuis '+(p.drivingOriginLabel||'CY – site des Chênes');
 const bus=[['bus'],'Itinéraire en bus depuis le site des Chênes',transitLink(p)];
 const car=[['car'],carLabel,drivingLink(p)];
 const foot=[['walk'],p.walkingOnlyToParking?'Itinéraire depuis '+from+' jusqu’au Parking 3':'Itinéraire '+(p.hideWalkModeInRouteLabel?'':'à pied ')+'depuis '+from,walkingLink(p)];
 if(p.type==='university'||p.noRoutes)return [];
 if(p.customKayakRoutes)return [foot,[['car'],'Itinéraire en voiture depuis CY — site des Chênes jusqu’au Parking 3, en passant par l’entrée de l’Île de loisirs',drivingLink(p)]];
 if(p.customSurfRoutes)return [[['walk'],'Itinéraire depuis CY — site des Chênes jusqu’à la Vague à surf',walkingLink(p)]];
 if(p.customRaftRoutes)return [[['walk'],'Itinéraire depuis CY — site des Chênes jusqu’au Rafting',walkingLink(p)]];
 if(p.customAccroRoutes)return [[['walk'],'Itinéraire depuis CY — site des Chênes jusqu’à l’Accrobranche',walkingLink(p)]];
 if(p.walkingOnlyToParking)return [foot];
 if(p.parking)return [bus,car,...(p.hideParkingWalk?[]:[[['walk'],'Accès uniquement à pied du parking jusqu’à l’activité — aucun accès voiture',walkingFromParkingLink(p)]])];
 if(p.combinedAll)return [[['walk','bus','car'],'Itinéraire '+(p.hideModesInRouteLabel?'':'à pied, en bus ou en voiture ')+'depuis '+from+(p.routeNote?' — '+p.routeNote:''),mixedFootCarLink(p)]];
 if(p.combinedFootCar)return [[['walk','car'],'Itinéraire '+(p.hideModesInRouteLabel?'':'à pied ou en voiture ')+'depuis '+from,mixedFootCarLink(p)]];
 if(p.footOnly)return [foot];
 return [[['walk'],'Itinéraire à pied depuis '+from,walkingLink(p)],...(p.noTransit?[]:[bus]),car];
}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function icon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','icon');s.setAttribute('aria-hidden','true');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#i-'+id);s.appendChild(u);return s}
function modeIcons(ids){const w=el('span','modes');ids.forEach(id=>w.appendChild(icon(id)));return w}
function city(p){const m=p.address.match(/\d{5}\s+([^—]+)/);return m?m[1].trim():''}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

const items=places.map((p,i)=>{

 const pinIcon=on=>L.divIcon({className:'',html:'<div class="pin'+(campus?' campus':'')+(on?' on':'')+'"><span>'+p.n+'</span></div>',iconSize:[34,34],iconAnchor:[17,34]});
 item.setPin=on=>{item.marker.setIcon(pinIcon(on));item.marker.setZIndexOffset(on?1000:0)};
 item.marker=L.marker([p.lat,p.lng],{icon:pinIcon(false),title:d.title,alt:d.title}).addTo(map);
 item.marker.bindTooltip(d.title,{direction:'top',offset:[0,-34],className:'pin-tip'});
 item.marker.on('click',()=>open(item));
 const row=el('button','place'+(campus?' campus':''));row.type='button';
 row.appendChild(el('span','num',p.n));
 const text=el('span','place-text');text.appendChild(el('span','place-title',d.title));
 text.appendChild(el('span','place-sub',[d.sub,city(p)].filter(Boolean).join(' · ')));
 row.appendChild(text);row.appendChild(modeIcons(modes.map(m=>m[0])));
 row.addEventListener('click',()=>open(item,row));
 item.row=row;return item;
});

function chip(box,label,pressed,onClick){
 const c=el('button','chip',label);c.type='button';c.setAttribute('aria-pressed',pressed);
 c.addEventListener('click',()=>{onClick(c);render(true)});box.appendChild(c);return c;
}
function pick(box,c){box.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c))}
const allDays=chip(dayChips,'Tous les jours',true,c=>{dayFilter='all';pick(dayChips,c)});

const allCats=chip(catChips,'Tous les sports',true,c=>{catFilter='all';pick(catChips,c)});
Object.keys(cats).forEach(k=>chip(catChips,cats[k],false,c=>{catFilter=k;pick(catChips,c)}));
const bonusChip=chip(catChips,'Point bonus',false,c=>{bonusOnly=!bonusOnly;c.setAttribute('aria-pressed',bonusOnly)});
function resetFilters(){
 q.value='';dayFilter='all';catFilter='all';bonusOnly=false;
 pick(dayChips,allDays);pick(catChips,allCats);bonusChip.setAttribute('aria-pressed',false);
}

function matches(hay){const t=norm(q.value.trim());return !t||t.split(/\s+/).every(w=>hay.includes(w))}
function filtering(){return dayFilter!=='all'||catFilter!=='all'||bonusOnly}
function visibleSessions(){
 return sessions.filter(s=>(dayFilter==='all'||s.day===dayFilter)&&(catFilter==='all'||s.cat===catFilter)&&(!bonusOnly||s.bonus)&&matches(s.hay));
}
function otherPlaces(){return filtering()?[]:items.filter(it=>!it.sessions.length&&matches(it.hay))}
function visible(){return [...new Set(visibleSessions().map(s=>s.item))].concat(otherPlaces())}
function sessionRow(s,inPlace){
 const row=el('button','place'+(s.item.campus?' campus':''));row.type='button';
 if(!inPlace)row.appendChild(el('span','num',s.item.p.n));
 const text=el('span','place-text');
 text.appendChild(el('span','place-title',s.sport));
 if(s.sub)text.appendChild(el('span','place-sub',s.sub));
 text.appendChild(el('span','place-sub',days[s.day]+' · '+s.time));
 if(!inPlace)text.appendChild(el('span','place-sub',s.where));
 row.appendChild(text);
 row.appendChild(s.bonus?el('span','bonus','Bonus'):el('span'));
 row.addEventListener('click',()=>open(s.item,row,s));
 return row;
}
function fit(all,animate){
 const near=all.filter(it=>!it.p.far),list=near.length?near:all;
 const pts=list.map(it=>[it.p.lat,it.p.lng]);
 if(!pts.length)return;
 if(pts.length===1)map.setView(pts[0],15,{animate:animate&&!calm});
 else map.fitBounds(pts,{padding:[46,46],maxZoom:15,animate:animate&&!calm});
}
function render(refit){
 const vis=visible();
 items.forEach(it=>{const on=vis.includes(it);if(on&&!map.hasLayer(it.marker))it.marker.addTo(map);if(!on&&map.hasLayer(it.marker))it.marker.remove()});
 lists.textContent='';
 const add=(title,arr)=>{
  if(!arr.length)return;
  lists.appendChild(el('h2','group',title));
  const ol=el('ol','places');arr.forEach(it=>{const li=el('li');li.appendChild(it.row);ol.appendChild(li)});lists.appendChild(ol);
 };
 const shown=visibleSessions();
 Object.keys(days).forEach(d=>{
  const rows=shown.filter(s=>s.day===d);
  if(!rows.length)return;
  lists.appendChild(el('h2','group',days[d]));
  const ol=el('ol','places');rows.forEach(s=>{const li=el('li');li.appendChild(sessionRow(s));ol.appendChild(li)});lists.appendChild(ol);
 });
 add('Autres lieux',otherPlaces());
 count.textContent=shown.length+(shown.length>1?' cours affichés':' cours affiché');
 if(!vis.length){
  const p=el('p','empty','Aucun cours ne correspond. ');const b=el('button',null,'Tout afficher');b.type='button';
  b.addEventListener('click',()=>{resetFilters();render(true);q.focus()});
  p.appendChild(b);lists.appendChild(p);
 }
 if(refit)fit(vis,true);
}

function open(item,row,session){
 if(current)current.setPin(false);
 if(!map.hasLayer(item.marker)){resetFilters();render(false)}
 current=item;lastRow=row||item.row;
 item.setPin(true);item.marker.closeTooltip();
 const p=item.p;
 detail.textContent='';
 const back=el('button','back');back.type='button';back.appendChild(icon('back'));back.appendChild(el('span',null,'Tous les lieux'));
 back.lastChild.textContent='Tous les cours';
 back.addEventListener('click',close);detail.appendChild(back);
 const scroll=el('div','scroll'),body=el('div','detail-body');
 const head=el('div','detail-head'+(item.campus?' campus':''));
 head.appendChild(el('span','num',p.n));
 const tw=el('div');
 const kicker=session?cats[session.cat]+(session.sub?' · '+session.sub:''):item.sub;
 if(kicker)tw.appendChild(el('p','kicker',kicker));
 const h=el('h2',null,session?session.sport:item.title);h.tabIndex=-1;tw.appendChild(h);
 head.appendChild(tw);body.appendChild(head);
 const dl=el('dl','facts');
 const fact=(k,v)=>{const d=el('div');d.appendChild(el('dt',null,k));const dd=el('dd');
  if(typeof v==='string')dd.textContent=v;else dd.appendChild(v);d.appendChild(dd);dl.appendChild(d)};
 if(session){
  fact('Quand',days[session.day]+', '+session.time.replace('–',' à '));
  fact('Où',session.where);
  fact('Évaluation',session.bonus?'Sport pour tous et point bonus : apprentissage évalué (L2 semestre 3 et L3 semestre 5)':'Sport pour tous : apprentissage non évalué');
  if(session.note)fact('À noter',session.note);
 }
 fact('Adresse',p.address);
 if(!p.hideAccessInfo){
  const w=el('span');w.style.cssText='display:flex;flex-wrap:wrap;align-items:center;gap:8px';
  if(item.modes.length)w.appendChild(modeIcons(item.modes.map(m=>m[0])));
  w.appendChild(el('span',null,p.bus));
  fact(p.accessLabel||'Bus',w);
 }
 body.appendChild(dl);
 const routes=routesFor(p),links=el('div','routes');
 const link=(ids,label,href,plain)=>{
  const a=el('a','route'+(plain?' plain':''));a.href=href;a.target='_blank';a.rel='noopener';
  a.appendChild(modeIcons(ids));a.appendChild(el('span',null,label));
  const o=el('span','out');o.appendChild(icon('out'));o.appendChild(el('span','sr-only',' (s’ouvre dans Google Maps)'));a.appendChild(o);links.appendChild(a);
 };
 routes.forEach(r=>link(r[0],r[1],r[2]));
 if(!p.hideMapLink)link(['pin'],'Voir le lieu',mapsLink(p),true);
 if(links.children.length){body.appendChild(el('h3',null,routes.length?'Y aller':'Sur la carte'));body.appendChild(links)}
 const here=item.sessions.filter(s=>s!==session);
 if(here.length){
  body.appendChild(el('h3',null,session?'Autres cours ici':'Cours ici'));
  const box=el('div','others');here.forEach(s=>box.appendChild(sessionRow(s,true)));body.appendChild(box);
 }
 scroll.appendChild(body);detail.appendChild(scroll);
 browse.hidden=true;detail.hidden=false;
 if(calm)map.setView([p.lat,p.lng],15);else map.flyTo([p.lat,p.lng],15,{duration:.7});
 history.replaceState(null,'',session?'#cours-'+session.id:'#lieu-'+item.id);
 if(row||document.activeElement===document.body)h.focus({preventScroll:true});
}
function close(){
 if(!current)return;
 current.setPin(false);current=null;
 detail.hidden=true;browse.hidden=false;
 history.replaceState(null,'',location.pathname+location.search);
 fit(visible(),true);
 if(lastRow&&lastRow.isConnected)lastRow.focus({preventScroll:true});
}

 map.invalidateSize();
 if(!current)fit(visible(),false);
 else map.setView([current.p.lat,current.p.lng],15,{animate:false});
 if(!started){
  started=true;
  const h=location.hash.match(/^#(lieu|cours)-(\d+)$/);
  if(h&&h[1]==='lieu'&&items[h[2]-1])open(items[h[2]-1]);
  if(h&&h[1]==='cours'&&sessions[h[2]-1])open(sessions[h[2]-1].item,null,sessions[h[2]-1]);
 }
}).observe(document.getElementById('map'));
render(false);
